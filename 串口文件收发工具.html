<style>

  select, input[type="text"], input[type="number"], textarea {

  button {

    border-radius: 6px;

    font-size: 13px;
    font-weight: 600;
    color: #fff;

  button:hover { background: var(--primary-dark); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--primary-dark); border: 1px solid var(--border); }
  button.ghost:hover { background: #f1f5f9; }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-dark); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .btn-row button { flex: 1; min-width: 90px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: #fff; color: var(--text); border: none; border-radius: 0; padding: 6px 12px; font-weight: 500; }
  .seg button.active { background: var(--primary); color: #fff; }
  .sep { height: 1px; background: var(--border); margin: 14px 0; }
  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .stats b { color: var(--text); font-family: var(--mono); }
  .log {
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 8px;

  .checkbox input { width: auto; }
  .fileinfo { font-size: 12px; color: var(--muted); margin-top: 6px; }

<script>
"use strict";

// ===== DOM =====
const $ = (id) => document.getElementById(id);
const statusDot = $("statusDot"), statusText = $("statusText");
const rxLog = $("rxLog");

// ===== 全局状态 =====
let port = null;
let writer = null;
let reader = null;
let keepReading = false;
let readLoopActive = false;
let rxDecoder = new TextDecoder("utf-8");
function setRxEncoding() { rxDecoder = new TextDecoder($("rxEncoding").value); }
$("rxEncoding").addEventListener("change", setRxEncoding);
$("rxReassemble").addEventListener("change", (e) => {
  rxReassemble = e.target.checked;
  rxLineArr = [];
  if (rxLineTimer) { clearTimeout(rxLineTimer); rxLineTimer = null; }
});
let txMode = "text";
let rxMode = "text";
let rxWrap = true;
let rxReassemble = true;   // 按行重组：攒到换行符才显示一整行
let txCount = 0;
let rxCount = 0;
let pendingFile = null;       // 待发送文件
let receivedChunks = [];      // 已接收字节缓冲（用于存盘）
let rxLineArr = [];           // 按行重组：跨 read() 攒字节，直到换行符
let rxLineTimer = null;       // 半行防抖定时器（设备不回换行符时也能刷出）
// 行重组静默阈值(ms)：连续无新字节达到该时长即判定"一包结束"并刷新显示。
// 5ms 在 115200bps 下约 57 个字节时间的空闲，判定包边界绰绰有余；显示延迟贴近原生串口软件。
// 若出现"一行被拆成两行"（设备回包中间有真实停顿），适当调大此值。
const RX_IDLE_MS = 5;

// 浏览器能力检测
function isInIframe() { try { return window.self !== window.top; } catch (e) { return true; } }
if (!("serial" in navigator)) {
  $("browserHint").textContent = "⚠ 当前浏览器不支持 Web Serial API，请使用 Chrome / Edge 桌面版直接打开本文件。";
  $("btnConnect").disabled = true;
} else if (isInIframe()) {
  $("browserHint").textContent = "⚠ 当前在预览框(iframe)内运行，Web Serial 不可用。请在 Chrome / Edge 中直接打开此 .html 文件再连接。";
} else {
  $("browserHint").textContent = "提示：需在 HTTPS 或 localhost/file 协议下运行。";
}

// ===== 工具函数 =====
function hexToBytes(str) {
  // 去除空格、逗号等分隔符，支持 "AA BB" / "AA,BB" / "AABB"
  const clean = str.replace(/[\s,;]+/g, "");
  if (clean.length % 2 !== 0) throw new Error("十六进制字节数必须为偶数");
  if (!/^[0-9a-fA-F]*$/.test(clean)) throw new Error("包含非法十六进制字符");
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}
function bytesToHex(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) {
    s += bytes[i].toString(16).padStart(2, "0").toUpperCase() + " ";
    if ((i + 1) % 16 === 0) s += "\n";
  }
  return s.trim();
}
// ASCII 转义显示：可打印字符原样显示，控制符/非法字节显式标出
function asciiEscape(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if (b === 0x00) s += "\\0";
    else if (b === 0x07) s += "\\a";   // 响铃
    else if (b === 0x08) s += "\\b";   // 退格
    else if (b === 0x09) s += "\\t";   // 制表
    else if (b === 0x0A) s += "\\n";   // 换行
    else if (b === 0x0B) s += "\\v";   // 垂直制表
    else if (b === 0x0C) s += "\\f";   // 换页
    else if (b === 0x0D) s += "\\r";   // 回车
    else if (b === 0x1B) s += "\\e";   // ESC
    else if (b >= 0x20 && b <= 0x7E) s += String.fromCharCode(b);
    else s += "\\x" + b.toString(16).padStart(2, "0").toUpperCase();
  }
  return s;
}
function fmtTimestamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,"0")}`;
}
function logLine(cls, text) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  rxLog.appendChild(div);
  rxLog.scrollTop = rxLog.scrollHeight;
  // 限制日志 DOM 数量，避免内存暴涨
  while (rxLog.childNodes.length > 4000) rxLog.removeChild(rxLog.firstChild);
}
function updateCount() {
  $("txCount").textContent = txCount;
  $("rxCount").textContent = rxCount;
}

// ===== 连接 / 断开 =====
$("btnConnect").addEventListener("click", async () => {
  try {
    port = await navigator.serial.requestPort();
    const opts = {
      baudRate: parseInt($("baudRate").value, 10),
      dataBits: parseInt($("dataBits").value, 10),
      stopBits: parseInt($("stopBits").value, 10),
      parity: $("parity").value,
      flowControl: $("flowControl").value,
      bufferSize: 65536,
    };
    await port.open(opts);
    // 连接后应用 DTR/RTS。CH340 的 DTR#/RTS# 输出低有效：API true(assert)=引脚低，false=引脚高。
    // 本电路 DTR 引脚低电平直连 NRST 低（电平触发复位）：不勾选=引脚高=MCU运行；勾选=引脚低=MCU复位。
    try {
      // 按「先 RTS 后 DTR」顺序应用：DTR(复位线) 总是最后动作，
      // 释放复位时 RTS(BOOT0) 已先稳定为低，MCU 复位释放瞬间不会误入 Bootloader
      await port.setSignals({ requestToSend: $("chkRTS").checked });
      await port.setSignals({ dataTerminalReady: $("chkDTR").checked });
      logLine("sys", `[${fmtTimestamp()}] 信号线引脚 DTR=${$("chkDTR").checked ? "低(复位)" : "高(运行)"}, RTS=${$("chkRTS").checked ? "低" : "高"}`);
    } catch (e) {
      logLine("sys", `[${fmtTimestamp()}] 设置 DTR/RTS 失败: ${e.message}`);
    }
    writer = port.writable.getWriter();
    statusDot.className = "dot on";
    statusText.textContent = `已连接 @ ${opts.baudRate} bps`;
    $("btnConnect").disabled = true;
    $("btnDisconnect").disabled = false;
    logLine("sys", `[${fmtTimestamp()}] 已打开串口，参数: ${opts.baudRate},${opts.dataBits}-${opts.stopBits}-${opts.parity}`);
    keepReading = true;
    readLoop();
  } catch (err) {
    statusDot.className = "dot err";
    statusText.textContent = "连接失败";
    logLine("sys", `[${fmtTimestamp()}] 连接错误: ${err.message}`);
  }
});

$("btnDisconnect").addEventListener("click", async () => {
  await disconnect();
});

// DTR / RTS 实时切换（连接状态下立即生效）
["chkDTR", "chkRTS"].forEach((id) => {
  $(id).addEventListener("change", async () => {
    if (!port) return;
    try {
      // 实时切换同样按「先 RTS 后 DTR」顺序，保证释放复位时 BOOT0 已稳定
      await port.setSignals({ requestToSend: $("chkRTS").checked });
      await port.setSignals({ dataTerminalReady: $("chkDTR").checked });
      logLine("sys", `[${fmtTimestamp()}] 信号线引脚 DTR=${$("chkDTR").checked ? "低(复位)" : "高(运行)"}, RTS=${$("chkRTS").checked ? "低" : "高"}`);
    } catch (e) {
      logLine("sys", "设置信号线失败: " + e.message);
    }
  });
});

async function disconnect() {
  keepReading = false;
  if (reader) { try { await reader.cancel(); } catch (e) {} }
  if (writer) { try { await writer.close(); } catch (e) {} try { await writer.releaseLock(); } catch (e) {} }
  if (port) { try { await port.close(); } catch (e) { logLine("sys", "关闭端口警告: " + e.message); } }
  writer = null; reader = null; port = null;
  rxLineArr = [];   // 断开时清空半行缓冲
  if (rxLineTimer) { clearTimeout(rxLineTimer); rxLineTimer = null; }
  statusDot.className = "dot";
  statusText.textContent = "未连接";
  $("btnConnect").disabled = false;
  $("btnDisconnect").disabled = true;
  // 停止自动发送
  stopAutoSend();
  logLine("sys", `[${fmtTimestamp()}] 串口已断开`);
}

// ===== 接收循环 =====
async function readLoop() {
  if (readLoopActive) return;
  readLoopActive = true;
  while (port && port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) { keepReading = false; break; }
        if (value && value.length) handleReceive(value);
      }
    } catch (err) {
      if (keepReading) logLine("sys", `[${fmtTimestamp()}] 读取异常: ${err.message}`);
    } finally {
      try { reader.releaseLock(); } catch (e) {}
    }
  }
  readLoopActive = false;
}

function appendRx(text) {
  const div = document.createElement("div");
  div.className = "rx";
  div.textContent = `[RX ${fmtTimestamp()}] ` + text;
  rxLog.appendChild(div);
  rxLog.scrollTop = rxLog.scrollHeight;
  while (rxLog.childNodes.length > 4000) rxLog.removeChild(rxLog.firstChild);
}

// 把一整行（已去掉结尾 \r\n）按当前显示模式渲染
function flushLine(lineBytes) {
  const arr = new Uint8Array(lineBytes);
  if (rxMode === "text") {
    let text = "";
    try { text = new TextDecoder($("rxEncoding").value).decode(arr); } catch (e) {}
    if (!rxWrap) text = text.replace(/[\r\n]+/g, " ");
    appendRx(text);
  } else if (rxMode === "ascii") {
    appendRx(asciiEscape(arr));
  } else {
    appendRx(bytesToHex(arr));
  }
}

// 设备不回换行符时，静默一段时间后把已攒的半行刷出来（带防抖）
function flushPartial() {
  rxLineTimer = null;
  if (rxLineArr.length === 0) return;
  const lineBytes = rxLineArr.slice();
  rxLineArr = [];
  flushLine(lineBytes);
}
function schedulePartialFlush() {
  if (rxLineTimer) clearTimeout(rxLineTimer);
  if (rxLineArr.length > 0) {
    rxLineTimer = setTimeout(flushPartial, RX_IDLE_MS);
  } else {
    rxLineTimer = null;
  }
}

function handleReceive(data) {
  rxCount += data.length;
  updateCount();
  // 缓冲用于存盘
  receivedChunks.push(data);

  // 按行重组：仅在 文本/ASCII转义 模式下生效（十六进制保留原始分包显示）
  if (rxReassemble && rxMode !== "hex") {
    for (let i = 0; i < data.length; i++) rxLineArr.push(data[i]);
    // 先按换行符拆出完整行（立即显示）
    let idx;
    while ((idx = rxLineArr.indexOf(0x0A)) !== -1) {
      const lineBytes = rxLineArr.slice(0, idx);    // 含末尾 0x0D（若有）
      rxLineArr = rxLineArr.slice(idx + 1);
      if (lineBytes.length && lineBytes[lineBytes.length - 1] === 0x0D) lineBytes.pop();
      flushLine(lineBytes);
    }
    // 设备可能不回换行符：静默 RX_IDLE_MS(10ms) 后把已收到的半行也刷出来，避免"看不到数据"
    schedulePartialFlush();
  } else {
    if (rxMode === "text") {
      let text = rxDecoder.decode(data, { stream: true });
      if (!rxWrap) {
        // 不换行模式：去掉换行符以便同行显示
        text = text.replace(/[\r\n]+/g, " ");
      }
      appendRx(text);
    } else if (rxMode === "ascii") {
      appendRx(asciiEscape(data));
    } else {
      appendRx(bytesToHex(data));
    }
  }

  // 自动存盘
  if ($("autoSave").checked) {
    const limit = parseInt($("autoSaveN").value, 10) || 65536;
    if (rxCount >= limit) {
      saveReceived(false);
      receivedChunks = [];
    }
  }
}

// ===== 发送 =====
async function doSend(bytes) {
  if (!port || !writer) { logLine("sys", "未连接串口，无法发送"); return; }
  try {
    await writer.write(bytes);
    txCount += bytes.length;
    updateCount();
    if (txMode === "text") {
      logLine("tx", `[TX ${fmtTimestamp()}] ${new TextDecoder().decode(bytes)}`.trim());
    } else {
      logLine("tx", `[TX ${fmtTimestamp()}] ${bytesToHex(bytes)}`);
    }
  } catch (err) {
    logLine("sys", `发送失败: ${err.message}`);
  }
}

$("btnSend").addEventListener("click", async () => {
  const raw = $("txInput").value;
  if (!raw && txMode === "text") { logLine("sys", "发送内容为空"); return; }
  let bytes;
  try {
    if (txMode === "text") {
      let payload = raw;
      if ($("txNewline").checked) payload += "\r\n";
      bytes = new TextEncoder().encode(payload);
    } else {
      bytes = hexToBytes(raw);
    }
  } catch (e) {
    logLine("sys", "解析发送数据失败: " + e.message);
    return;
  }
  await doSend(bytes);
});

// ===== 发送文件（字节流） =====
$("btnSendFile").addEventListener("click", () => {
  if (!port) { logLine("sys", "请先连接串口再发送文件"); return; }
  $("filePicker").click();
});
$("filePicker").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!port || !writer) { logLine("sys", "串口未连接"); return; }
  try {
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    // 分块发送，避免大文件一次性写入阻塞
    const CHUNK = 4096;
    for (let off = 0; off < bytes.length; off += CHUNK) {
      const slice = bytes.subarray(off, Math.min(off + CHUNK, bytes.length));
      await doSend(slice);
    }
    logLine("sys", `文件已发送: ${file.name} (${bytes.length} 字节)`);
  } catch (err) {
    logLine("sys", "文件发送失败: " + err.message);
  }
  $("filePicker").value = "";
});

// ===== 保存接收为文件 =====
function flattenChunks() {
  let total = 0;
  for (const c of receivedChunks) total += c.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of receivedChunks) { out.set(c, off); off += c.length; }
  return out;
}
function saveReceived(notify = true) {
  if (receivedChunks.length === 0) { if (notify) logLine("sys", "暂无接收数据可保存"); return; }
  const data = flattenChunks();
  const blob = new Blob([data], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().replace(/[:.]/g, "-");
  a.href = url;
  a.download = `serial_rx_${ts}.bin`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  if (notify) logLine("sys", `已保存接收数据: ${data.length} 字节 -> serial_rx_${ts}.bin`);
}
$("btnSave").addEventListener("click", () => { saveReceived(true); receivedChunks = []; });

// ===== 清空 =====
$("btnClearTx").addEventListener("click", () => { $("txInput").value = ""; });
$("btnClearRx").addEventListener("click", () => {
  rxLog.innerHTML = ""; receivedChunks = []; rxCount = 0; updateCount();
  try { rxDecoder = new TextDecoder($("rxEncoding").value); } catch (e) {}
});

// ===== 模式切换 =====
$("txMode").querySelectorAll("button").forEach((b) => {
  b.addEventListener("click", () => {
    $("txMode").querySelectorAll("button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    txMode = b.dataset.mode;
    $("txInput").placeholder = txMode === "text" ? "输入要发送的内容…" : "例如： A1 B2 CC 0D 0A";
    $("txNewline").disabled = txMode !== "text";
  });
});
$("rxMode").querySelectorAll("button").forEach((b) => {
  b.addEventListener("click", () => {
    $("rxMode").querySelectorAll("button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    rxMode = b.dataset.mode;
    $("rxEncoding").disabled = rxMode !== "text";
    rxLineArr = [];
    if (rxLineTimer) { clearTimeout(rxLineTimer); rxLineTimer = null; }
    rxLog.innerHTML = "";
  });
});
$("rxWrap").querySelectorAll("button").forEach((b) => {
  b.addEventListener("click", () => {
    $("rxWrap").querySelectorAll("button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    rxWrap = b.dataset.wrap === "on";
  });
});

// ===== 自动发送 =====
let autoTimer = null;
function startAutoSend() {
  stopAutoSend();
  const iv = parseInt($("autoInterval").value, 10) || 1000;
  autoTimer = setInterval(() => $("btnSend").click(), iv);
  logLine("sys", `已开启自动发送，间隔 ${iv}ms`);
}
function stopAutoSend() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}
$("autoSend").addEventListener("change", (e) => {
  if (e.target.checked) startAutoSend(); else { stopAutoSend(); logLine("sys", "已关闭自动发送"); }
});

// 页面关闭前尝试释放串口
window.addEventListener("beforeunload", () => { if (port) port.close().catch(()=>{}); });

logLine("sys", "工具已就绪，点击「连接串口」选择设备。");
</script>
</body>
</html>
